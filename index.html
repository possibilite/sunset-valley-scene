  copyMat.uniforms.uThreshold.value = 0.9;
  pass(copyMat, qA);
  for (const s of [1.5, 3.0]) {
    blurMat.uniforms.tDiffuse.value = qA.texture; blurMat.uniforms.uDir.value.set(s / qA.width, 0); pass(blurMat, qB);
    blurMat.uniforms.tDiffuse.value = qB.texture; blurMat.uniforms.uDir.value.set(0, s / qA.height); pass(blurMat, qA);
  }

  const u = compositeMat.uniforms;
  u.tScene.value = sceneRT.texture; u.tDepth.value = sceneRT.depthTexture;
  u.tBlur.value = halfA.texture; u.tBloom.value = qA.texture;
  u.uTime.value = t; u.uRes.value.set(sw, sh);
  pass(compositeMat, null);
}

/* =========================================================
   Controls (drag to look, space to pause)
   ========================================================= */
let yaw = 0, pitch = -0.02, dragging = false, lastX = 0, lastY = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  el.setPointerCapture(e.pointerId); el.classList.add('dragging');
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.0045;
  pitch -= (e.clientY - lastY) * 0.0045;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
const endDrag = () => { dragging = false; el.classList.remove('dragging'); };
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

let paused = false;
addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  allocTargets();
});

/* =========================================================
   Animation loop
   ========================================================= */
const SPEED = 4.0;
const U_START = 0.07, U_END = 0.97;
let u = U_START, heading = null;
const qs = new URLSearchParams(location.search);   // optional ?u=0.5&yaw=1 to jump along the river
if (qs.has('u')) u = Math.min(U_END, Math.max(0, parseFloat(qs.get('u')) || U_START));
if (qs.has('yaw')) yaw = parseFloat(qs.get('yaw')) || 0;
if (qs.has('pitch')) pitch = parseFloat(qs.get('pitch')) || 0;
water.userData.noShadow = true;
sky.userData.noShadow = true;
scene.traverse(o => {
  if (!o.isMesh || o.userData.noShadow) return;
  o.receiveShadow = true;
  o.castShadow = !o.userData.noCast;
});
const clock = new THREE.Clock();
const _yAxis = new THREE.Vector3(0, 1, 0), _fwd = new THREE.Vector3();
const camWorld = new THREE.Vector3();

function respawnPetal(p, anywhere) {
  const a = rand() * 6.28, r = rr(4, 34);
  p.x = camWorld.x + Math.cos(a) * r;
  p.z = camWorld.z + Math.sin(a) * r;
  p.y = anywhere ? rr(0.3, 13) : rr(9, 14);
  p.vy = rr(0.16, 0.36); p.ph = rand() * 6.28; p.sw = rr(0.25, 0.6);
  p.rx = rand() * 6.28; p.ry = rand() * 6.28; p.spin = rr(0.6, 1.6);
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  let jumped = false;
  if (!paused) {
    u += dt * SPEED / RIVER_LEN;
    if (u > U_END) { u = U_START; jumped = true; }
  }
  const p = river.getPointAt(u);
  const tan = river.getTangentAt(Math.min(u + 0.01, 1));
  const target = Math.atan2(-tan.x, -tan.z);
  if (heading === null || jumped) heading = target;
  else {
    let d = target - heading;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    heading += d * Math.min(1, dt * 1.5);
  }
  boat.position.set(p.x, 0.03 + Math.sin(t * 1.2) * 0.04, p.z);
  boat.rotation.set(Math.sin(t * 0.8) * 0.01, heading, Math.sin(t * 1.0) * 0.018);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  scene.updateMatrixWorld();
  camera.getWorldPosition(camWorld);
  sky.position.copy(camWorld);
  skyMat.uniforms.uTime.value = t;
  windTime.value = t;
  updateDetail();
  // world-fixed morning sun that drifts very slowly, with soft passing-cloud dimming
  SUN_DIR.copy(SUN_BASE).applyAxisAngle(_yAxis, Math.sin(t * 0.02) * 0.05);
  SUN_DIR.y = SUN_BASE.y + Math.sin(t * 0.017) * 0.02; SUN_DIR.normalize();
  _fwd.set(0, 0, -1).transformDirection(camera.matrixWorld); _fwd.y = 0; _fwd.normalize();
  sun.target.position.copy(camWorld).addScaledVector(_fwd, 22); sun.target.position.y = 0;
  sun.target.updateMatrixWorld();
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 400);
  renderer.shadowMap.needsUpdate = true;
  const cloud = 0.88 + 0.12 * (0.5 + 0.5 * Math.sin(t * 0.11) * Math.sin(t * 0.047));
  sun.intensity = 1.7 * cloud;
  sun.color.setRGB(1.0, 0.9 + 0.02 * cloud, 0.78 + 0.03 * cloud);

  // petals: slow fall with a gentle side-to-side flutter
  if (petals.length === 0) for (let i = 0; i < PETALS; i++) { const q = {}; respawnPetal(q, true); petals.push(q); }
  for (let i = 0; i < PETALS; i++) {
    const q = petals[i];
    q.y -= q.vy * dt * (0.75 + 0.5 * Math.sin(t * 1.3 + q.ph) ** 2);
    q.x += (Math.sin(t * 0.9 + q.ph) * q.sw + 0.18) * dt;
    q.z += Math.cos(t * 0.7 + q.ph * 1.7) * q.sw * 0.6 * dt;
    q.rx += dt * q.spin; q.ry += dt * q.spin * 0.7;
    if (q.y < 0.03 || Math.hypot(q.x - camWorld.x, q.z - camWorld.z) > 38) respawnPetal(q, jumped);
    _e.set(q.rx, q.ry, Math.sin(t * 2 + q.ph) * 0.6); _q.setFromEuler(_e);
    _p.set(q.x, q.y, q.z);
    _s.setScalar(smooth(2.0, 4.5, Math.hypot(q.x - camWorld.x, q.y - camWorld.y, q.z - camWorld.z)));
    petalMesh.setMatrixAt(i, _m.compose(_p, _q, _s));
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  waterMat.uniforms.uTime.value = t;

  // 1) reflection pass (everything above the water, seen from the mirrored camera)
  updateMirror();
  water.visible = false;
  renderer.clippingPlanes = clipAboveWater;
  renderer.setRenderTarget(reflRT);
  renderer.render(scene, mirrorCam);
  renderer.clippingPlanes = [];
  water.visible = true;

  // 2) main pass into HDR target, 3) post-processing to screen
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  postProcess(t);

  requestAnimationFrame(tick);
}
tick();
const loading = document.getElementById('loading');
loading.style.opacity = 0; setTimeout(() => loading.remove(), 900);
</script>
</body>
</html>
